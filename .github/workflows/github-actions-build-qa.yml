name: Build and test

on:
  pull_request:
    branches:
      - master
      - stage
  push:
    branches:
      - master
      - stage
  workflow_dispatch:

jobs:

  build-and-test:
    name: Build and test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: enterwell/wp-starter:latest
